services:

  studio-logged-app:
    image: php:8.4-fpm-alpine
    container_name: studio-logged-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_NAME=Studio Logged
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://studio.logged.cloud
      - DB_CONNECTION=mysql
      - DB_HOST=studio-logged-db
      - DB_PORT=3306
      - DB_DATABASE=studio-logged
      - DB_USERNAME=studio-logged
      - DB_PASSWORD=secret
      - REDIS_HOST=studio-logged-redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      # Dusk bot passwords · read by `php artisan dusk:accounts` when run here
      # (this container has DB write access; studio-logged-dusk is read-only).
      - DUSK_USER_PASSWORD=Dusk-User-Pw-4823
      - DUSK_ADMIN_PASSWORD=Dusk-Admin-Pw-b1fc
      - DUSK_PREMIUM_PASSWORD=Dusk-Premium-Pw-ee41
    # Hairpin · the OAuth back-channel POST to auth.logged.cloud/oauth/token
    # was timing out (cURL error 28 / 6) because the container sometimes
    # couldn't resolve or route via the WAN IP and back through Caddy.
    # Map the auth hostname straight to Caddy's LAN IP so HTTPS hits the
    # reverse proxy on the local network without bouncing off the WAN.
    extra_hosts:
      - "auth.logged.cloud:10.0.0.208"
    networks:
      - caddy_proxy
      - internal

  # Long-lived worker · runs the code loaded at boot. After deploying changes
  # to any queued job, restart this: `docker compose restart studio-logged-queue`
  # (or `php artisan queue:restart`), otherwise it keeps running the old code.
  studio-logged-queue:
    image: studio-logged-app-local
    container_name: studio-logged-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    volumes:
      - ./src:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_NAME=Studio Logged
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://studio.logged.cloud
      - DB_CONNECTION=mysql
      - DB_HOST=studio-logged-db
      - DB_PORT=3306
      - DB_DATABASE=studio-logged
      - DB_USERNAME=studio-logged
      - DB_PASSWORD=secret
      - REDIS_HOST=studio-logged-redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - studio-logged-redis
      - studio-logged-db
    networks:
      - caddy_proxy
      - internal

  studio-logged-nginx:
    image: nginx:alpine
    container_name: studio-logged-nginx
    restart: unless-stopped
    ports:
      - "8107:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - studio-logged-app
    networks:
      - caddy_proxy
      - internal

  studio-logged-db:
    image: mysql:8
    container_name: studio-logged-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=studio-logged
      - MYSQL_USER=studio-logged
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=rootsecret
    volumes:
      - studio-logged-db-data:/var/lib/mysql
    networks:
      - internal

  studio-logged-redis:
    image: redis:alpine
    container_name: studio-logged-redis
    restart: unless-stopped
    networks:
      - internal

  # Headless Chrome that Dusk drives. shm_size avoids Chrome crashing on the
  # default 64MB /dev/shm.
  studio-logged-selenium:
    image: selenium/standalone-chrome
    container_name: studio-logged-selenium
    restart: unless-stopped
    shm_size: 2gb
    networks:
      - internal

  # Dusk browser-test runner. Its long-lived process is the HTTP trigger
  # (docker/dusk/runner.php); a POST to /run executes `php artisan dusk`.
  # APP_ENV is non-production so Dusk's production guard passes; the tests
  # themselves drive the LIVE app (http://studio-logged-nginx) and DB.
  studio-logged-dusk:
    image: studio-logged-app-local
    container_name: studio-logged-dusk
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html", "/runner.php"]
    volumes:
      - ./src:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/dusk/runner.php:/runner.php
    environment:
      - APP_NAME=Studio Logged
      - APP_ENV=dusk
      - APP_DEBUG=true
      - APP_URL=http://studio-logged-nginx
      - DB_CONNECTION=mysql
      - DB_HOST=studio-logged-db
      - DB_PORT=3306
      - DB_DATABASE=studio-logged
      # SELECT-only DB user · the test process physically cannot write or
      # delete. Provision accounts/fixtures from studio-logged-app instead.
      - DB_USERNAME=studio-logged-ro
      - DB_PASSWORD=Ro-Dusk-Pw-5bf0
      - REDIS_HOST=studio-logged-redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=sync
      - DUSK_DRIVER_URL=http://studio-logged-selenium:4444
      - DUSK_TOKEN=dusk-trigger-822388e45a2d0a3d
      - DUSK_USER_PASSWORD=Dusk-User-Pw-4823
      - DUSK_ADMIN_PASSWORD=Dusk-Admin-Pw-b1fc
      - DUSK_PREMIUM_PASSWORD=Dusk-Premium-Pw-ee41
    depends_on:
      - studio-logged-selenium
      - studio-logged-db
      - studio-logged-redis
      - studio-logged-nginx
    networks:
      - internal

volumes:
  studio-logged-db-data:

networks:
  caddy_proxy:
    external: true
  internal:
    driver: bridge
