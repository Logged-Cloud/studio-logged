services:

  studio-logged-app:
    image: php:8.4-fpm-alpine
    container_name: studio-logged-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_NAME=Studio Logged
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://studio.logged.cloud
      - DB_CONNECTION=mysql
      - DB_HOST=studio-logged-db
      - DB_PORT=3306
      - DB_DATABASE=studio-logged
      - DB_USERNAME=studio-logged
      - DB_PASSWORD=secret
      - REDIS_HOST=studio-logged-redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=sync
    networks:
      - caddy_proxy
      - internal

  studio-logged-nginx:
    image: nginx:alpine
    container_name: studio-logged-nginx
    restart: unless-stopped
    ports:
      - "8107:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - studio-logged-app
    networks:
      - caddy_proxy
      - internal

  studio-logged-db:
    image: mysql:8
    container_name: studio-logged-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=studio-logged
      - MYSQL_USER=studio-logged
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=rootsecret
    volumes:
      - studio-logged-db-data:/var/lib/mysql
    networks:
      - internal

  studio-logged-redis:
    image: redis:alpine
    container_name: studio-logged-redis
    restart: unless-stopped
    networks:
      - internal

volumes:
  studio-logged-db-data:

networks:
  caddy_proxy:
    external: true
  internal:
    driver: bridge
