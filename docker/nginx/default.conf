server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20M;

    # Compress text responses · the ~89KB landing HTML drops to ~12KB on the
    # wire, and the built CSS/JS shrink ~5x. text/html is gzipped implicitly.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # Vite build assets and self-hosted fonts are content-hashed / immutable ·
    # cache them hard (PSI: efficient cache lifetimes).
    location ~ ^/(build|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream studio-logged-app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}