name: tests

on:
  push:
    branches: [ main ]
  pull_request:

defaults:
  run:
    working-directory: src

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, sqlite3, mbstring, bcmath, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint Blade + PHP syntax
        run: |
          find app config routes -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run unit + feature tests
        run: php artisan test

      - name: Resolve every named route
        run: |
          php artisan route:list --json | jq -e '. | length > 0'
