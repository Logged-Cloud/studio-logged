name: tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, sqlite3, mbstring, bcmath, gd, exif, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # logged-cloud/auth-client and logged-cloud/navigation are public on
      # GitHub, so composer can pull the VCS repos over plain HTTPS — no
      # deploy key, no Packagist token. If either repo ever goes private,
      # add a webfactory/ssh-agent step here with COMPOSER_SSH_KEYS.
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
